name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stable-core:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TezzNative SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $ProgressPreference = "SilentlyContinue"
          $cacheKey = if ($env:GITHUB_SHA) { $env:GITHUB_SHA } else { [guid]::NewGuid().ToString("N") }

          function Save-Url {
            param(
              [string]$Url,
              [string]$OutFile,
              [int]$TimeoutSec = 90
            )

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Remove-Item -LiteralPath $OutFile -Force -ErrorAction SilentlyContinue
              try {
                Write-Host "Downloading attempt $attempt from $Url"
                Invoke-WebRequest `
                  -UseBasicParsing `
                  -Headers @{ "User-Agent" = "TezzNative-GitHub-Actions" } `
                  -TimeoutSec $TimeoutSec `
                  -Uri $Url `
                  -OutFile $OutFile
                if ((Test-Path -LiteralPath $OutFile) -and (Get-Item -LiteralPath $OutFile).Length -gt 0) {
                  return $true
                }
              } catch {
                Write-Warning "Download attempt $attempt failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds (3 * $attempt)
            }
            return $false
          }

          function Assert-Sha256 {
            param(
              [string]$Path,
              [string]$Expected,
              [string]$Label
            )

            if ([string]::IsNullOrWhiteSpace($Expected)) {
              Write-Warning "No expected checksum available for $Label"
              return
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToUpperInvariant()
            if ($actual -ne $Expected.ToUpperInvariant()) {
              throw "$Label checksum mismatch. Expected $Expected got $actual"
            }
            Write-Host "$Label SHA-256 verified: $actual"
          }

          function Test-MzBinary {
            param([string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) {
              return $false
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $Path).Path)
            return ($bytes.Length -gt 1024 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A)
          }

          $manifest = $null
          try {
            $manifest = Invoke-RestMethod `
              -UseBasicParsing `
              -Headers @{ "User-Agent" = "TezzNative-GitHub-Actions" } `
              -TimeoutSec 45 `
              -Uri "https://tn.tezzcorp.com/download/release_manifest.json?v=$cacheKey"
          } catch {
            Write-Warning "Release manifest download failed: $($_.Exception.Message)"
          }

          function Get-ManifestHash {
            param([string]$Path)
            if (-not $manifest -or -not $manifest.artifacts) {
              return ""
            }
            $artifact = $manifest.artifacts | Where-Object { $_.path -eq $Path } | Select-Object -First 1
            if ($artifact) {
              return [string]$artifact.sha256
            }
            return ""
          }

          $compilerCandidates = @(
            @{ Url = "https://tn.tezzcorp.com/download/sdk/bin/tezzc-windows-x64.exe?v=$cacheKey"; Path = "download/sdk/bin/tezzc-windows-x64.exe" },
            @{ Url = "https://tn.tezzcorp.com/download/sdk/bin/tezzc.exe?v=$cacheKey"; Path = "download/sdk/bin/tezzc.exe" }
          )
          foreach ($candidate in $compilerCandidates) {
            if (Save-Url -Url $candidate.Url -OutFile "tezzc.exe" -TimeoutSec 75) {
              if (Test-MzBinary -Path "tezzc.exe") {
                Assert-Sha256 -Path "tezzc.exe" -Expected (Get-ManifestHash -Path $candidate.Path) -Label "Windows compiler"
                $compilerPath = (Resolve-Path -LiteralPath tezzc.exe).Path
                "TEZZC=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Append
                return
              }
              Write-Warning "Downloaded compiler is not a Windows executable"
            }
          }

          $sdkUrls = @(
            "https://tn.tezzcorp.com/download/tezznative-sdk.zip?v=$cacheKey",
            "https://tn.tezzcorp.com/api/download_request.php?artifact=windows-sdk&source=github-actions&v=$cacheKey"
          )
          $downloaded = $false
          foreach ($sdkUrl in $sdkUrls) {
            if (Save-Url -Url $sdkUrl -OutFile "tezznative-sdk.zip" -TimeoutSec 150) {
              $downloaded = $true
              break
            }
          }
          if (-not $downloaded) {
            throw "Unable to download TezzNative SDK from API or static fallback"
          }

          $zipPath = (Resolve-Path -LiteralPath tezznative-sdk.zip).Path
          $expectedZip = Get-ManifestHash -Path "download/tezznative-sdk.zip"
          if ([string]::IsNullOrWhiteSpace($expectedZip)) {
            try {
              $shaText = Invoke-WebRequest `
                -UseBasicParsing `
                -Headers @{ "User-Agent" = "TezzNative-GitHub-Actions" } `
                -TimeoutSec 45 `
                -Uri "https://tn.tezzcorp.com/download/tezznative-sdk.zip.sha256?v=$cacheKey"
              $expectedZip = (($shaText.Content.Trim() -split "\s+")[0]).ToUpperInvariant()
            } catch {
              Write-Warning "SDK checksum sidecar download failed: $($_.Exception.Message)"
            }
          }
          Assert-Sha256 -Path $zipPath -Expected $expectedZip -Label "Windows SDK ZIP"

          $bytes = [System.IO.File]::ReadAllBytes($zipPath)
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4B) {
            $previewLength = [Math]::Min(4, $bytes.Length)
            $preview = if ($previewLength -gt 0) { $bytes[0..($previewLength - 1)] -join "," } else { "<empty>" }
            throw "Downloaded SDK is not a ZIP archive. First bytes: $preview"
          }
          Expand-Archive tezznative-sdk.zip -DestinationPath tezznative-sdk -Force
          $compilerEntries = Get-ChildItem tezznative-sdk -Recurse -File |
            Where-Object { $_.Name -like "tezzc*" } |
            Sort-Object FullName
          $compilerEntries | ForEach-Object { Write-Host "SDK entry: $($_.FullName) ($($_.Length) bytes)" }
          $compiler = $compilerEntries |
            Where-Object { $_.Name -in @("tezzc-windows-x64.exe", "tezzc.exe") } |
            Sort-Object @{ Expression = { if ($_.Name -eq "tezzc-windows-x64.exe") { 0 } else { 1 } } }, FullName |
            Select-Object -First 1
          if (-not $compiler) {
            throw "tezzc compiler not found in SDK archive"
          }
          $probe = Get-ChildItem tezznative-sdk -Recurse -File -Filter tls_connect_ex_probe.tn | Select-Object -First 1
          if ($probe) {
            & $compiler.FullName check $probe.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Downloaded SDK compiler failed bundled probe with exit $LASTEXITCODE"
            }
          }
          "TEZZC=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run stable-core conformance
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\tests\conformance\run.ps1 -Tezzc "$env:TEZZC"

      - name: Run ABI conformance
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\tests\conformance\run-abi.ps1 -Tezzc "$env:TEZZC"

      - name: Check benchmark fixtures
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\benchmarks\run.ps1 -Tezzc "$env:TEZZC" -CheckOnly

      - name: Run native smoke
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\tests\conformance\run-native-smoke.ps1 -Tezzc "$env:TEZZC"

  linux-stable-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TezzNative Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          cache_key="${GITHUB_SHA:-$(date +%s)}"
          ua="TezzNative-GitHub-Actions"

          fetch_artifact() {
            local url="$1"
            local output="$2"
            local label="$3"
            local max_time="$4"

            rm -f "$output"
            echo "Downloading ${label} with curl from ${url}"
            if curl --http1.1 -fL --retry 2 --retry-all-errors --retry-delay 5 \
              --connect-timeout 25 --max-time "$max_time" \
              -A "$ua" \
              -o "$output" \
              "$url"; then
              if [[ -s "$output" ]]; then
                return 0
              fi
              echo "${label} download produced an empty file" >&2
            fi

            rm -f "$output"
            echo "Retrying ${label} over IPv4"
            if curl -4 --http1.1 -fL --retry 1 --retry-all-errors --retry-delay 5 \
              --connect-timeout 25 --max-time "$max_time" \
              -A "$ua" \
              -o "$output" \
              "$url"; then
              if [[ -s "$output" ]]; then
                return 0
              fi
              echo "${label} IPv4 download produced an empty file" >&2
            fi

            if command -v wget >/dev/null 2>&1; then
              rm -f "$output"
              echo "Retrying ${label} with wget"
              if wget --tries=2 --timeout="$max_time" --header="User-Agent: ${ua}" \
                -O "$output" \
                "$url"; then
                if [[ -s "$output" ]]; then
                  return 0
                fi
                echo "${label} wget download produced an empty file" >&2
              fi
            fi

            return 1
          }

          is_elf() {
            local file="$1"
            [[ -s "$file" ]] || return 1
            [[ "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" == "7f454c46" ]]
          }

          compiler_gz_urls=(
            "https://tn.tezzcorp.com/download/tezzc-linux-x64.gz?v=${cache_key}"
          )
          compiler=""
          for compiler_gz_url in "${compiler_gz_urls[@]}"; do
            if fetch_artifact "$compiler_gz_url" tezzc-linux-x64.gz "compressed Linux compiler" 180; then
              if gzip -t tezzc-linux-x64.gz; then
                gzip -dc tezzc-linux-x64.gz > tezzc-linux-x64
                if is_elf tezzc-linux-x64; then
                  chmod +x tezzc-linux-x64
                  compiler="./tezzc-linux-x64"
                  break
                fi
                echo "Compressed Linux compiler did not expand to an ELF binary" >&2
              else
                echo "Compressed Linux compiler is not a gzip archive" >&2
              fi
            fi
          done
          if [[ -n "$compiler" ]]; then
            echo "TEZZC=$compiler" >> "$GITHUB_ENV"
            exit 0
          fi

          compiler_urls=(
            "https://tn.tezzcorp.com/download/sdk/bin/tezzc-linux-x64?v=${cache_key}"
          )
          for compiler_url in "${compiler_urls[@]}"; do
            if fetch_artifact "$compiler_url" tezzc-linux-x64 "Linux compiler" 60; then
              if is_elf tezzc-linux-x64; then
                chmod +x tezzc-linux-x64
                compiler="./tezzc-linux-x64"
                break
              fi
              echo "Downloaded Linux compiler is not an ELF binary; trying the next source" >&2
              file tezzc-linux-x64 || true
              head -c 96 tezzc-linux-x64 || true
              echo
            fi
          done
          if [[ -n "$compiler" ]]; then
            echo "TEZZC=$compiler" >> "$GITHUB_ENV"
            exit 0
          fi

          sdk_urls=(
            "https://tn.tezzcorp.com/download/tezznative-sdk-linux.tar.gz?v=${cache_key}"
            "https://tn.tezzcorp.com/api/download_request.php?artifact=linux-sdk&source=github-actions&v=${cache_key}"
          )
          downloaded=0
          for sdk_url in "${sdk_urls[@]}"; do
            if fetch_artifact "$sdk_url" tezznative-sdk-linux.tar.gz "Linux SDK" 180; then
              if gzip -t tezznative-sdk-linux.tar.gz; then
                downloaded=1
                break
              fi
              echo "Downloaded Linux SDK is not a gzip archive; trying the next source" >&2
              file tezznative-sdk-linux.tar.gz || true
              head -c 96 tezznative-sdk-linux.tar.gz || true
              echo
            fi
          done
          if [[ "$downloaded" -ne 1 ]]; then
            echo "Unable to download TezzNative Linux SDK from direct, API, or static fallback" >&2
            exit 1
          fi

          mkdir -p tezznative-sdk
          tar -xzf tezznative-sdk-linux.tar.gz -C tezznative-sdk
          find tezznative-sdk -type f -name 'tezzc*' -print
          compiler="$(find tezznative-sdk -type f -name 'tezzc-linux-x64' | sort | sed -n '1p')"
          if [[ -z "$compiler" ]]; then
            compiler="$(find tezznative-sdk -type f -name 'tezzc' | sort | sed -n '1p')"
          fi
          if [[ -z "$compiler" ]]; then
            echo "tezzc compiler not found in Linux SDK archive" >&2
            exit 1
          fi
          if ! is_elf "$compiler"; then
            echo "SDK compiler is not an ELF binary: ${compiler}" >&2
            file "$compiler" || true
            exit 1
          fi
          chmod +x "$compiler"
          echo "TEZZC=$compiler" >> "$GITHUB_ENV"

      - name: Run stable-core conformance
        shell: bash
        timeout-minutes: 5
        run: bash tests/conformance/run.sh "$TEZZC"

      - name: Run ABI conformance
        shell: bash
        timeout-minutes: 5
        run: bash tests/conformance/run-abi.sh "$TEZZC"

      - name: Check benchmark fixtures
        shell: bash
        timeout-minutes: 5
        run: bash benchmarks/run.sh "$TEZZC" --check-only

      - name: Run native smoke
        shell: bash
        timeout-minutes: 5
        run: bash tests/conformance/run-native-smoke.sh "$TEZZC"
