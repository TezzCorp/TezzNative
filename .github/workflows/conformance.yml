name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stable-core:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TezzNative SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $cacheKey = if ($env:GITHUB_SHA) { $env:GITHUB_SHA } else { [guid]::NewGuid().ToString("N") }
          $compilerUrls = @(
            "https://tn.tezzcorp.com/download/sdk/bin/tezzc-windows-x64.exe?v=$cacheKey",
            "https://tn.tezzcorp.com/download/sdk/bin/tezzc.exe?v=$cacheKey"
          )
          $directCompiler = $false
          foreach ($compilerUrl in $compilerUrls) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              Remove-Item -LiteralPath tezzc.exe -Force -ErrorAction SilentlyContinue
              Write-Host "Downloading compiler attempt $attempt from $compilerUrl"
              & curl.exe -4 -fL --retry 1 --retry-delay 3 --connect-timeout 20 --max-time 120 -A "TezzNative-GitHub-Actions" -o tezzc.exe $compilerUrl
              $curlExit = $LASTEXITCODE
              if ($curlExit -eq 0 -and (Test-Path -LiteralPath tezzc.exe)) {
                $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath tezzc.exe).Path)
                if ($bytes.Length -gt 1024 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
                  $directCompiler = $true
                  break
                }
              }
              Write-Warning "Compiler download attempt $attempt failed with curl exit $curlExit"
              Start-Sleep -Seconds (5 * $attempt)
            }
            if ($directCompiler) {
              break
            }
          }
          if ($directCompiler) {
            $compilerPath = (Resolve-Path -LiteralPath tezzc.exe).Path
            "TEZZC=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            return
          }

          $sdkUrls = @(
            "https://tn.tezzcorp.com/api/download_request.php?artifact=windows-sdk&source=github-actions&v=$cacheKey",
            "https://tn.tezzcorp.com/download/tezznative-sdk.zip?v=$cacheKey"
          )
          $downloaded = $false
          foreach ($sdkUrl in $sdkUrls) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              Remove-Item -LiteralPath tezznative-sdk.zip -Force -ErrorAction SilentlyContinue
              Write-Host "Downloading SDK attempt $attempt from $sdkUrl"
              & curl.exe -4 -fL --retry 1 --retry-delay 3 --connect-timeout 20 --max-time 240 -A "TezzNative-GitHub-Actions" -o tezznative-sdk.zip $sdkUrl
              $curlExit = $LASTEXITCODE
              if ($curlExit -eq 0 -and (Test-Path -LiteralPath tezznative-sdk.zip)) {
                $downloaded = $true
                break
              }
              Write-Warning "SDK download attempt $attempt failed with curl exit $curlExit"
              Start-Sleep -Seconds (5 * $attempt)
            }
            if ($downloaded) {
              break
            }
          }
          if (-not $downloaded) {
            throw "Unable to download TezzNative SDK from API or static fallback"
          }
          $zipPath = (Resolve-Path -LiteralPath tezznative-sdk.zip).Path
          $bytes = [System.IO.File]::ReadAllBytes($zipPath)
          if ($bytes.Length -lt 4 -or $bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4B) {
            $previewLength = [Math]::Min(4, $bytes.Length)
            $preview = if ($previewLength -gt 0) { $bytes[0..($previewLength - 1)] -join "," } else { "<empty>" }
            throw "Downloaded SDK is not a ZIP archive. First bytes: $preview"
          }
          Expand-Archive tezznative-sdk.zip -DestinationPath tezznative-sdk -Force
          $compilerEntries = Get-ChildItem tezznative-sdk -Recurse -File |
            Where-Object { $_.Name -like "tezzc*" } |
            Sort-Object FullName
          $compilerEntries | ForEach-Object { Write-Host "SDK entry: $($_.FullName) ($($_.Length) bytes)" }
          $compiler = $compilerEntries |
            Where-Object { $_.Name -in @("tezzc-windows-x64.exe", "tezzc.exe") } |
            Sort-Object @{ Expression = { if ($_.Name -eq "tezzc-windows-x64.exe") { 0 } else { 1 } } }, FullName |
            Select-Object -First 1
          if (-not $compiler) {
            throw "tezzc compiler not found in SDK archive"
          }
          $probe = Get-ChildItem tezznative-sdk -Recurse -File -Filter tls_connect_ex_probe.tn | Select-Object -First 1
          if ($probe) {
            & $compiler.FullName check $probe.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Downloaded SDK compiler failed bundled probe with exit $LASTEXITCODE"
            }
          }
          "TEZZC=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run stable-core conformance
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\tests\conformance\run.ps1 -Tezzc "$env:TEZZC"

      - name: Run ABI conformance
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\tests\conformance\run-abi.ps1 -Tezzc "$env:TEZZC" -SkipVerify

      - name: Check benchmark fixtures
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\benchmarks\run.ps1 -Tezzc "$env:TEZZC" -CheckOnly

      - name: Run native smoke
        shell: powershell
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & .\tests\conformance\run-native-smoke.ps1 -Tezzc "$env:TEZZC"

  linux-stable-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TezzNative Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          cache_key="${GITHUB_SHA:-$(date +%s)}"
          ua="TezzNative-GitHub-Actions"

          fetch_artifact() {
            local url="$1"
            local output="$2"
            local label="$3"
            local max_time="$4"

            rm -f "$output"
            echo "Downloading ${label} with curl from ${url}"
            if curl --http1.1 -fL --retry 2 --retry-all-errors --retry-delay 5 \
              --connect-timeout 25 --max-time "$max_time" \
              -A "$ua" \
              -o "$output" \
              "$url"; then
              if [[ -s "$output" ]]; then
                return 0
              fi
              echo "${label} download produced an empty file" >&2
            fi

            rm -f "$output"
            echo "Retrying ${label} over IPv4"
            if curl -4 --http1.1 -fL --retry 1 --retry-all-errors --retry-delay 5 \
              --connect-timeout 25 --max-time "$max_time" \
              -A "$ua" \
              -o "$output" \
              "$url"; then
              if [[ -s "$output" ]]; then
                return 0
              fi
              echo "${label} IPv4 download produced an empty file" >&2
            fi

            if command -v wget >/dev/null 2>&1; then
              rm -f "$output"
              echo "Retrying ${label} with wget"
              if wget --tries=2 --timeout="$max_time" --header="User-Agent: ${ua}" \
                -O "$output" \
                "$url"; then
                if [[ -s "$output" ]]; then
                  return 0
                fi
                echo "${label} wget download produced an empty file" >&2
              fi
            fi

            return 1
          }

          is_elf() {
            local file="$1"
            [[ -s "$file" ]] || return 1
            [[ "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" == "7f454c46" ]]
          }

          compiler_urls=(
            "https://tn.tezzcorp.com/download/sdk/bin/tezzc-linux-x64?v=${cache_key}"
          )
          compiler=""
          for compiler_url in "${compiler_urls[@]}"; do
            if fetch_artifact "$compiler_url" tezzc-linux-x64 "Linux compiler" 60; then
              if is_elf tezzc-linux-x64; then
                chmod +x tezzc-linux-x64
                compiler="./tezzc-linux-x64"
                break
              fi
              echo "Downloaded Linux compiler is not an ELF binary; trying the next source" >&2
              file tezzc-linux-x64 || true
              head -c 96 tezzc-linux-x64 || true
              echo
            fi
          done
          if [[ -n "$compiler" ]]; then
            "$compiler" version || true
            echo "TEZZC=$compiler" >> "$GITHUB_ENV"
            exit 0
          fi

          sdk_urls=(
            "https://tn.tezzcorp.com/download/tezznative-sdk-linux.tar.gz?v=${cache_key}"
            "https://tn.tezzcorp.com/api/download_request.php?artifact=linux-sdk&source=github-actions&v=${cache_key}"
          )
          downloaded=0
          for sdk_url in "${sdk_urls[@]}"; do
            if fetch_artifact "$sdk_url" tezznative-sdk-linux.tar.gz "Linux SDK" 180; then
              if gzip -t tezznative-sdk-linux.tar.gz; then
                downloaded=1
                break
              fi
              echo "Downloaded Linux SDK is not a gzip archive; trying the next source" >&2
              file tezznative-sdk-linux.tar.gz || true
              head -c 96 tezznative-sdk-linux.tar.gz || true
              echo
            fi
          done
          if [[ "$downloaded" -ne 1 ]]; then
            echo "Unable to download TezzNative Linux SDK from direct, API, or static fallback" >&2
            exit 1
          fi

          mkdir -p tezznative-sdk
          tar -xzf tezznative-sdk-linux.tar.gz -C tezznative-sdk
          find tezznative-sdk -type f -name 'tezzc*' -print
          compiler="$(find tezznative-sdk -type f -name 'tezzc-linux-x64' | sort | sed -n '1p')"
          if [[ -z "$compiler" ]]; then
            compiler="$(find tezznative-sdk -type f -name 'tezzc' | sort | sed -n '1p')"
          fi
          if [[ -z "$compiler" ]]; then
            echo "tezzc compiler not found in Linux SDK archive" >&2
            exit 1
          fi
          if ! is_elf "$compiler"; then
            echo "SDK compiler is not an ELF binary: ${compiler}" >&2
            file "$compiler" || true
            exit 1
          fi
          chmod +x "$compiler"
          "$compiler" version || true
          echo "TEZZC=$compiler" >> "$GITHUB_ENV"

      - name: Run stable-core conformance
        shell: bash
        timeout-minutes: 5
        run: bash tests/conformance/run.sh "$TEZZC"

      - name: Run ABI conformance
        shell: bash
        timeout-minutes: 5
        run: bash tests/conformance/run-abi.sh "$TEZZC"

      - name: Check benchmark fixtures
        shell: bash
        timeout-minutes: 5
        run: bash benchmarks/run.sh "$TEZZC" --check-only

      - name: Run native smoke
        shell: bash
        timeout-minutes: 5
        run: bash tests/conformance/run-native-smoke.sh "$TEZZC"
